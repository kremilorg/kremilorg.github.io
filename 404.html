<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена — KremilOrg</title>
<meta name="description" content="Такой страницы нет. Вернитесь на главную KremilOrg или откройте один из наших проектов.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--ink:#000;--muted:#555;--line:#ddd;--accent:#000;--accent-ink:#fff;--ph:#f3f3f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--muted:#aaa;--line:#2a2a2a;--accent:#fff;--accent-ink:#000;--ph:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--muted:#aaa;--line:#2a2a2a;--accent:#fff;--accent-ink:#000;--ph:#111;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
main{max-width:560px;width:100%}
.code{font-size:96px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
h1{font-size:28px;line-height:1.2;margin:0 0 12px}
p{margin:0 0 14px;color:var(--muted)}
.path{display:block;margin:0 0 24px;padding:10px 12px;background:var(--ph);border:1px solid var(--line);border-radius:6px;font:14px ui-monospace,Consolas,monospace;color:var(--ink);overflow-wrap:anywhere}
.path[hidden]{display:none}
.btn{display:inline-block;padding:13px 28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
ul{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:600px){.code{font-size:72px}}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Страница не найдена</h1>
  <p>Такой страницы нет. Возможно, ссылка устарела или в адресе есть опечатка.</p>
  <code class="path" id="path" hidden></code>
  <a class="btn" href="/">На главную</a>
  <ul aria-label="Наши проекты">
    <li><a href="/voltshred/">VoltShred Browser</a></li>
    <li><a href="/kremilar/">KremilAR</a></li>
    <li><a href="/kremilrp/">KremilRP</a></li>
    <li><a href="/license.html">Лицензии</a></li>
  </ul>
</main>
<script>
(function(){
  try{
    var p=location.pathname+location.search;
    if(p&&p!=='/'){var el=document.getElementById('path');el.textContent=p;el.hidden=false}
  }catch(e){}
})();
</script>
</body>
</html>
